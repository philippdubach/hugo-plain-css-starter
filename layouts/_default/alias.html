<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default "en" }}">
<head>
    <meta charset="utf-8">
    <title>Redirecting · {{ .Site.Params.site_name | default .Site.Title }}</title>
    <link rel="canonical" href="{{ .Permalink }}">
    {{- /* Meta refresh only — no inline script. Each alias page's script body
           would need its own CSP hash, which would break the hash-based
           script-src. The live domain 301s these paths at the edge anyway;
           these pages are the GitHub Pages standby fallback. */}}
    <meta http-equiv="refresh" content="0; url={{ .Permalink }}">
</head>
<body>
    <p>Redirecting to <a href="{{ .Permalink }}">{{ .Permalink }}</a>...</p>
</body>
</html>
