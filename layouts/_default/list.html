{{ define "main" }}
  <main id="main-content" class="standalone-page" tabindex="-1">
    <header class="page-heading"><h1>{{ .Title }}</h1>{{ with .Description }}<p class="page-intro">{{ . }}</p>{{ end }}</header>
    {{ with .Content }}<div class="article-body">{{ . }}</div>{{ end }}
    <ul class="section-list">
      {{ range .Pages.ByTitle }}<li><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ with .Description }}<p>{{ . }}</p>{{ end }}</li>{{ end }}
    </ul>
  </main>
{{ end }}
