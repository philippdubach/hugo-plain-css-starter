<aside class="site-rail" aria-label="Site tools">
  <div class="site-rail__inner">
    <nav class="site-navigation" aria-label="Primary navigation">
      <a href="{{ site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>Home</a>
      <a href="{{ (site.GetPage "/writing").RelPermalink }}"{{ if or (eq .Section "writing") (eq .Section "posts") }} aria-current="page"{{ end }}>Writing</a>
      <a href="{{ (site.GetPage "/projects").RelPermalink }}"{{ if eq .RelPermalink "/projects/" }} aria-current="page"{{ end }}>Projects</a>
      <a href="{{ (site.GetPage "/research").RelPermalink }}"{{ if eq .RelPermalink "/research/" }} aria-current="page"{{ end }}>Research</a>
      <a href="/links/">Links</a>
      <div class="site-navigation__secondary">
        <a href="/subscribe/"{{ if eq .RelPermalink "/subscribe/" }} aria-current="page"{{ end }}>Subscribe</a>
      </div>
    </nav>

    <div class="rail-tools">
      {{ partial "theme-button.html" (dict "class" "theme-toggle--rail") }}
    </div>

    {{ if and .IsPage (eq .Section "posts") (in .TableOfContents "<li>") }}
      {{ $toc := replace .TableOfContents `<nav id="TableOfContents">` `<nav id="desktop-toc" aria-label="On this page">` }}
      <div class="desktop-toc" data-desktop-toc>
        <p class="utility-label">Contents</p>
        {{ $toc | safeHTML }}
      </div>
    {{ end }}
  </div>
</aside>
